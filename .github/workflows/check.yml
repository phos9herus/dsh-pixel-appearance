name: check

on:
  push:
  pull_request:

jobs:
  build-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild client bundle
        run: node src/build.mjs
      - name: Verify generated bundle is committed
        run: git diff --exit-code -- client.js
      - name: Syntax check
        run: |
          node --check client.js
          node --check index.js
      - name: Validate manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/en.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('locale/zh.json','utf8'))"
